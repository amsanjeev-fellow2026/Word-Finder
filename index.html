<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RF Word Finder</title>
<style>

:root{--bg:#f7f8fc;--ink:#1f2937;--mut:#7a8396;--acc:#4f63d8;--accd:#3f51bf;--warm:#f0b45a;--line:#e8ebf3;--soft:#eff2fb;--footer-h:clamp(20px,3.2vh,30px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:1.3vh;background:#fff;padding:.9vh 1.8vh;font-weight:600;font-size:2vh;color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--acc);background:var(--soft)}
button:disabled{opacity:.4;cursor:not-allowed}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}.pri:hover:not(:disabled){background:var(--accd);border-color:var(--accd)}.pri{box-shadow:0 .5vh 1.6vh #4f63d833}
.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--mut);font-size:1.8vh;padding:.6vh 1.2vh}
.lnk{border:0;background:none;color:var(--acc);text-decoration:underline;font-size:1.9vh}
#ft{position:fixed;left:0;right:0;bottom:0;height:var(--footer-h);display:flex;align-items:center;justify-content:center;font-size:1.6vh;color:var(--mut);background:var(--bg);border-top:1px solid var(--line);z-index:50;white-space:nowrap;overflow:hidden;padding:0 1vh}
#app{height:calc(100% - var(--footer-h));height:calc(100dvh - var(--footer-h));display:flex;flex-direction:column;gap:1.2vh;padding:1.4vh 1.6vw}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:1vh;flex-wrap:wrap}
.brand{font-size:2.7vh;font-weight:700;letter-spacing:.1vh}.brand span{color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center;align-items:center}
.auth{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh}
.logo{font-size:6vh;font-weight:700}.logo span{color:var(--acc)}
.tag{font-size:2.3vh;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:2.2vh;box-shadow:0 .6vh 2.4vh #1f29370d}
.a{width:min(92vw,52vh);padding:2.4vh;display:flex;flex-direction:column;gap:1.3vh}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.6vh;background:var(--soft);padding:.5vh;border-radius:1.6vh}
.tabs button{border:0;background:transparent;color:var(--mut)}.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 .2vh .8vh #0001}
input{font-size:2.2vh;padding:1.3vh 1.6vh;border-radius:1.3vh;border:1px solid var(--line);background:#fff;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.err{color:#d1523f;font-weight:600;min-height:2.6vh;font-size:2vh;text-align:center}
.fine{font-size:1.6vh;color:var(--mut);text-align:center;line-height:1.4}
.setup{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh}
.title{font-size:5vh;font-weight:700;text-align:center}.title span{color:var(--acc)}
.sub{font-size:1.9vh;letter-spacing:.3vh;color:var(--mut);font-weight:600}
.sec{width:100%}
.lbl{font-size:2vh;font-weight:700;color:var(--mut);text-align:center;margin-bottom:.7vh;text-transform:uppercase;letter-spacing:.15vh}
.two{display:flex;gap:4vw;justify-content:center}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.setup input{width:25vh;text-align:center}
select{font:inherit;font-size:2vh;padding:1vh 1.4vh;border-radius:1.3vh;border:1px solid var(--line);background:#fff}
.big{font-size:3vh;padding:1.2vh 5vh}
#sb{display:flex;gap:1vh;align-items:stretch;padding:.8vh 1.2vh}
.tm{flex:1;text-align:center;border-bottom:.5vh solid transparent;padding:.3vh}
.tm.act{border-bottom-color:var(--acc)}.tm .n{color:var(--ink)}
.tm b{display:block;font-size:2.1vh;color:var(--mut);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .n{font-size:6vh;font-weight:700;line-height:1.05}
.tm button{font-size:1.5vh;padding:.3vh 1vh;margin-top:.3vh}
.mid{flex:1.1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:700;font-size:2vh;letter-spacing:.2vh}
.mid small{color:var(--mut);font-size:1.7vh;font-weight:600;letter-spacing:0}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:1.4vh}
.scene{position:relative;min-height:0;border-radius:2.4vh;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(90deg,#e9f2ec 0 7vw,#e2eee7 7vw 14vw)}
.goal{position:absolute;left:50%;top:9%;transform:translateX(-50%);height:46%;aspect-ratio:2.1/1;max-width:94%;border:.6vh solid #334155;border-bottom:0;border-radius:.8vh .8vh 0 0;background:#fff8;background-image:linear-gradient(#1f29371a .2vh,transparent .2vh),linear-gradient(90deg,#1f29371a .2vh,transparent .2vh);background-size:2.4vh 2.4vh}
.goal.net{animation:ripple .6s}
.keeper{position:absolute;left:0;right:0;bottom:0;height:66%;display:flex;justify-content:center}
.keeper svg{height:100%;width:auto;aspect-ratio:.6;animation:sway 1.2s ease-in-out infinite alternate}
.ball{position:absolute;left:50%;bottom:6%;width:8vh;height:8vh;margin-left:-4vh;z-index:3}
.spot{position:absolute;left:50%;bottom:4%;width:11vh;height:2.4vh;margin-left:-5.5vh;border-radius:50%;background:#1f293714}
.bn{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:14vh;font-weight:700;z-index:30;pointer-events:none;text-shadow:0 .4vh 2vh #fff;animation:pop .6s,out .5s 1.8s forwards}
.bn.goal{color:var(--acc)}.bn.assist{color:#c58512}.bn.team{color:#52707f;font-size:9vh}
.pan{display:flex;flex-direction:column;gap:1.1vh;padding:1.6vh 2vh;min-height:0;overflow-y:auto;scrollbar-width:none}.pan>*{flex-shrink:0}.pan>.rword{flex-shrink:1}
.rd{font-size:1.8vh;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.2vh}
.word{flex:1;min-height:0;font-size:14vh;font-weight:700;text-align:center;line-height:1.1;display:flex;align-items:center;justify-content:center;flex-direction:column}
.word.s{font-size:5vh;line-height:1.3}.word.p{font-size:3.3vh;line-height:1.4;font-weight:700}
.word.s span,.word.p span{display:block}
.hl{color:var(--acc);text-decoration:underline;text-decoration-thickness:.5vh;text-underline-offset:.8vh}
.ref{min-height:6vh;font-size:2.3vh;color:var(--mut);text-align:center;display:flex;align-items:center;justify-content:center}
.done{font-size:3.4vh;padding:1.6vh 0;width:100%}
.tp{display:flex;flex-direction:column;gap:1vh}
.tl{font-size:2vh;font-weight:700;color:var(--mut);text-align:center}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:1vh}
.tb button{font-size:2.3vh;padding:1.5vh 1vh;border-width:2px}
.g1{background:#e6f6ee;border-color:#bfe3d0;color:#1d6b4b}.g2{background:#e3f4f3;border-color:#bfe0dd;color:#126a64}
.g3{background:#fef3df;border-color:#f3dba9;color:#8a5a0a}.g4{background:#eff1f7;border-color:#d9deea;color:#475569}
.pr{font-size:2.3vh;text-align:center;line-height:1.4}
.ov{position:fixed;inset:0 0 var(--footer-h) 0;background:#1f293766;backdrop-filter:blur(.6vh);display:flex;align-items:center;justify-content:center;padding:1.5vh;z-index:10}
.box{background:#fff;border:1px solid var(--line);border-radius:3vh;box-shadow:0 2vh 6vh #1f293733;padding:2.4vh;width:min(96vw,1100px);max-height:calc(100dvh - var(--footer-h) - 2vh);overflow-y:auto;scrollbar-width:none;text-align:center;display:flex;flex-direction:column;gap:1.3vh;align-items:center}
.q2{font-size:3vh;font-weight:700}.ans{font-size:4.2vh;font-weight:700}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh;text-align:left;width:100%}
.rg div{background:var(--soft);border-radius:1.8vh;padding:1.3vh 1.5vh;font-size:1.85vh;line-height:1.4}
.rg h3{margin:0 0 .5vh;color:var(--acc);font-size:2.3vh}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh;width:100%}
.st div{background:var(--soft);border-radius:1.6vh;padding:1vh}.st b{display:block;font-size:3.8vh}.st small{font-size:1.7vh;color:var(--mut)}
.nt{font-size:2vh;text-align:left;width:100%;line-height:1.45}
textarea{width:100%;height:30vh;border:1px solid var(--line);border-radius:1.4vh;padding:1.2vh;font-size:1.7vh;line-height:1.4;resize:none;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace}
.hist{width:100%;display:flex;flex-direction:column;gap:.8vh;max-height:50vh;overflow-y:auto}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:1vh;background:var(--soft);border-radius:1.4vh;padding:1vh 1.4vh;text-align:left;font-size:1.9vh}
.cf{position:fixed;top:-6vh;width:1.4vh;height:2.2vh;border-radius:.3vh;animation:fall 3.2s linear forwards;z-index:40;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes sway{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes ripple{40%{filter:brightness(.85)}}
@keyframes out{to{opacity:0}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.main2{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:1.4vh}
.left{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;container-type:size}
.board{--bs:min(100cqw,100cqh);display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:.7vh;width:var(--bs);height:var(--bs);flex:none;margin:0 auto;text-align:center;letter-spacing:0;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:1px solid var(--line);border-radius:2.2vh;padding:1.4vh;box-shadow:0 .6vh 2.4vh #1f29370d}
.cell{display:flex;align-items:center;justify-content:center;border-radius:1.2vh;font-weight:600;font-size:calc(min(64vh,50vw,var(--bs))/var(--n)*.5);background:#f3f5fc;color:#334155;cursor:pointer;line-height:1;min-width:0;min-height:0;padding:0;overflow:hidden}
.cell.sel{background:var(--acc);color:#fff;box-shadow:0 .4vh 1.2vh #4f63d84d}
.cell.f{text-decoration:underline;text-decoration-thickness:.4vh}
.f0{background:#d7f0e4}.f1{background:#fde8c4}.f2{background:#d6e6fb}.f3{background:#e8dcf7}.f4{background:#fbd9d5}.f5{background:#e3f0c6}
.txt{background:#fff;border:1px solid var(--line);border-radius:2.2vh;padding:2.6vh;color:#334155;font-size:min(4vh,3.3vw);line-height:1.7;box-shadow:0 1vh 3vh #1f293712;max-height:100%;width:100%;overflow-y:auto;scrollbar-width:none}
.w{cursor:pointer;border-radius:.8vh;padding:0 .3vh}.w.sel{background:var(--acc);color:#fff}.w.fnd{text-decoration:underline;text-decoration-thickness:.4vh}
.selw{min-height:7vh;font-size:5vh;font-weight:700;text-align:center;letter-spacing:.6vh;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.selw.t{font-size:2.6vh;letter-spacing:0}
.msgl{min-height:6vh;font-size:2.1vh;color:var(--mut);text-align:center;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:.8vh;justify-content:center;max-height:17vh;overflow-y:auto;scrollbar-width:none}
.chip.ms{background:#fdf0d9;color:#8a5a0a;letter-spacing:0}.chip{font-size:2vh;padding:.6vh 1.4vh;border-radius:5vh;background:var(--soft);color:var(--mut);letter-spacing:.3vh;border:1px solid transparent}.chip.on{background:var(--acc);color:#fff;letter-spacing:0}
.clue{font-size:2.3vh;font-weight:600;text-align:center;background:var(--soft);border-radius:1.6vh;padding:1.2vh;color:#334155}
.rword{flex:1;min-height:0;font-size:13vh;font-weight:700;text-align:center;line-height:1.1;display:flex;align-items:center;justify-content:center;flex-direction:column}
.rword.t{font-size:4.2vh;line-height:1.3}
.cell.hint,.w.hint{animation:hp 1s ease-in-out infinite alternate;box-shadow:0 0 0 .5vh var(--warm) inset}
.cell.ms{background:#fdf0d9;box-shadow:0 0 0 .35vh var(--warm) inset}.w.mis{background:#fdf0d9;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:.4vh}
@keyframes hp{from{filter:brightness(1)}to{filter:brightness(.88)}}
.acts{display:flex;gap:1vh;justify-content:center;flex-wrap:wrap}
.acts button{font-size:2vh}
.fin{border-color:#d9deea;color:#475569}
@media (max-aspect-ratio:1/1){
.main2{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.05fr) minmax(0,1fr)}
.board{--bs:min(100%,48vh);--bs:min(100cqw,100cqh)}
.txt{font-size:min(3.2vh,5.2vw)}
.st{grid-template-columns:repeat(2,1fr)}
}
@supports not (width:1cqw){.board{--bs:min(100%,64vh)}}
.pts{position:fixed;left:50%;top:13%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:3vh;padding:1.2vh 3.2vh;font-size:3.2vh;font-weight:700;color:var(--accd);box-shadow:0 1vh 3vh #1f293722;z-index:35;pointer-events:none;text-align:center;animation:ptsin .3s,out .5s 2.7s forwards}.pts small{display:block;font-size:1.9vh;color:var(--mut);font-weight:600;margin-top:.3vh}
@keyframes ptsin{from{opacity:0;transform:translate(-50%,-1.2vh)}}
.pv{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center;max-width:90vw}
.pv div{display:flex;gap:.5vh;align-items:center;background:#fff;border:1px solid var(--line);border-radius:1.6vh;padding:.8vh 1.2vh;font-size:2.6vh;font-weight:700}
.pv button{font-size:1.5vh;padding:.4vh .9vh}

const $=s=>document.querySelector(s),app=$('#app');

const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const PR=[{"n":"Vowels","k":"w","p":[["Short a","a","Listen for the short /a/ sound in the middle.","cat map bag hat sad pan jam fan lamp crab flag stamp black snack basket magnet napkin backpack",[8,14]],["Short e","e","Listen for the short /e/ sound in the middle.","bed pen net hen red leg web ten nest belt desk sled help letter helmet dentist",[8,13]],["Short i","i","Listen for the short /i/ sound in the middle.","pig sit lip pin win dig kid big milk drip swim drink stick window kitten picnic",[8,13]],["Short o","o","Listen for the short /o/ sound in the middle.","dog hop pot mop box top fox job frog clock stomp block drop rocket pocket problem",[8,13]],["Short u","u","Listen for the short /u/ sound in the middle.","sun bug cup mud run hut jug gum duck drum trunk stuck plum rubber bucket puppet",[8,13]]]},{"n":"CVC words","k":"w","p":[["Mixed CVC","","Say each sound, then blend them: /m/ /a/ /p/ - map.","map sit hop bed cup pig dog sun hat pen web mix jug fit rub wax yak zip vet",[10,15]],["Word families","","Keep the ending the same and change the first sound.","cat mat sat bat fan can man cap map tap nap lap gap flat plan clap snap",[7,13]],["Look-alike words","","Check the first, middle and last sound one at a time.","pin pan pen big bag bug hot hit cut sit hat hut bit bet bat but",[6,12]]]},{"n":"Consonant blends","k":"w","p":[["Initial blends","str/spl/scr/spr/st/cl/fl/br/gr/tr/pl/sl/dr/fr/sw/sn/sp/gl","Say both sounds at the start. Do not drop either one.","stop clap frog drum trip plan slip grab swim snap spin clip glad string street splash scrub spring",[6,13]],["Final blends","nd/mp/lk/st/nt/ft/lt","Listen for both sounds at the end of the word.","hand milk jump nest tent gift belt sand lamp best melt pond lift plant stamp frost shift",[6,13]]]},{"n":"Digraphs","k":"w","p":[["sh","sh","The letters sh work together to make one sound: /sh/.","ship shop fish shed wish shut dish shell brush shark shelf crash fishing shadow shopping shampoo",[7,12]],["ch","ch","The letters ch work together to make one sound: /ch/.","chip chin chop much rich chat lunch chest chimp bench chick punch chicken children chimney champion",[6,12]],["th (/θ/ words)","th","The letters th work together to make one quiet sound: /th/ as in thin. Put the tongue gently between the teeth and blow air. It is not the buzzing sound in this or that.","thin thick think thank bath path math moth both tooth teeth cloth three throw thumb thorn thigh fifth tenth thud thief mouth month north south earth sloth thirty thirteen thirsty thunder thunderstorm Thursday healthy wealthy nothing something anything everything birthday bathtub bathroom bathmat toothpick toothpaste toothbrush pathfinder thousand toothache earthquake mouthwash pathway mammoth Thanksgiving thoughtful thankful thankless thickness thimble thermos thermometer athletic athlete mathematics thoroughly theory authority enthusiastic mathematician marathon arithmetic sympathy",[27,54]],["th (voiced /ð/)","th","The letters th also make a buzzing sound: /th/ as in this. Your voice buzzes while the tongue touches the teeth.","this that them then than with these those they there mother brother father other feather weather together another",[6,14]],["wh","wh","The letters wh work together to make the /w/ sound.","when whip which what whisk wheel white whale wheat whisper whistle whiskers whirlpool",[4,9]],["ph","ph","The letters ph work together to make the /f/ sound.","phone graph photo phonics dolphin nephew alphabet elephant telephone paragraph",[3,6]],["ck","ck","The letters ck work together to make the /k/ sound at the end.","duck sock back neck kick rock clock truck block stick quick rocket pocket jacket bucket",[6,11]]]},{"n":"Long vowels and teams","k":"w","p":[["Silent e","","The silent e at the end makes the vowel say its name.","cake kite bone cube make late hide home rope five gate nose bike tube snake pancake inside cupcake bedtime",[6,15]],["ai / ay","ai/ay","The vowel team ai or ay says /a/ as in rain.","rain mail day play stay paint snail tray train spray tail explain afraid mailbox holiday",[5,11]],["ee / ea","ee/ea","The vowel team ee or ea says /e/ as in seed.","seed feet tree bean meat team sheep beach green sleep sweet cheese teacher peanut beehive seaside",[6,12]],["oa / ow","oa/ow","The vowel team oa or ow says /o/ as in boat.","boat road soap goat snow grow bowl yellow coat float blow slow toast rainbow snowman elbow toaster",[7,13]]]},{"n":"R-controlled vowels","k":"w","p":[["ar","ar","The letters ar say /ar/ as in car.","car star farm park barn yard shark march cart start smart garden market carpet artist",[6,11]],["or","or","The letters or say /or/ as in corn.","corn fork born horn horse storm sport north short porch stork morning popcorn corner orbit",[4,11]],["er / ir / ur","er/ir/ur","The letters er, ir and ur all say /er/ as in bird.","fern bird girl turn burn hurt shirt nurse stir curl first butter number purple turtle",[6,11]]]},{"n":"Multisyllabic words","k":"w","p":[["Two syllables","","Break the word into parts, then read it smoothly.","sun+shine foot+ball pic+nic rab+bit pup+pet ten+nis win+dow pen+cil sis+ter cap+tain bas+ket gar+den pil+low hun+dred pic+ture bot+tle ex+press",[5,13]],["Three syllables","","Break the word into parts, then read it smoothly.","ba+na+na yes+ter+day but+ter+fly el+e+phant com+pu+ter re+mem+ber ex+cit+ing to+ma+to fan+tas+tic dif+fer+ent hos+pi+tal ex+cel+lent im+por+tant ad+ven+ture",[3,8]]]},{"n":"Phrases and sentences","k":"s","p":[["Phrases","","Read the words together in one smooth phrase.","a red hat|the big dog|a hot cup|ten fat pigs|the fast truck|a green frog|a shiny red ship|the chimp in the tree",[3,5]],["Sentences","","Group the words into meaningful chunks and pause at the full stop.","The ship is big.|We drank cold milk at lunch.|The frog jumps into the pond.|Ben ran fast to catch the bus.|The goat climbed up the steep road.|The shark swam past the small boat.|The sheep sleep in the green field.|She put a thick blanket on her bed.|The captain passed the ball to his teammate.",[3,6]]]},{"n":"Connected passages","k":"p","p":[["Short passages","","Read smoothly in phrases. Then think about what the passage said.","Sam has a red kite. The wind is strong today. Sam runs to the park to fly it.~Where does Sam go?|A little frog sat on a log. Splash! It jumped into the pond to swim with the fish.~What did the frog do?|Mia and Dev made a snow fort. It took them one hour. Then they drank hot milk.~What did they drink?|The team practised every day. On Saturday they played a big match. They won by three goals.~When was the match?|Dad cooked rice and beans for lunch. Everyone said it was tasty. The bowls were empty in ten minutes.~Why were the bowls empty?",[2,4]]]}];

function gen(ws,df,dc){const dirs=DIRS[df],maxL=Math.max(...ws.map(w=>w.length),...dc.map(w=>w.length)),base={easy:6,standard:8,challenge:10}[df];
for(let size=Math.max(base,maxL+1);size<Math.max(base,maxL+1)+7;size++){for(let tr=0;tr<25;tr++){
const g=Array.from({length:size},()=>Array(size).fill('')),place=w=>{for(let a=0;a<250;a++){const d=pick(dirs),r0=r(0,size-1),c0=r(0,size-1),r1=r0+d[0]*(w.length-1),c1=c0+d[1]*(w.length-1);if(r1<0||r1>=size||c1<0||c1>=size)continue;
let ok=true;for(let i=0;i<w.length;i++){const v=g[r0+d[0]*i][c0+d[1]*i];if(v&&v!==w[i]){ok=false;break}}if(!ok)continue;const p=[];for(let i=0;i<w.length;i++){g[r0+d[0]*i][c0+d[1]*i]=w[i];p.push([r0+d[0]*i,c0+d[1]*i])}return p}return null};
const pos=new Map();let ok=true;for(const w of [...new Set(ws)].sort((a,b)=>b.length-a.length)){const p=place(w);if(!p){ok=false;break}pos.set(w,[p])}if(!ok)continue;
const dp=[];dc.forEach(w=>{const p=place(w);if(p)dp.push(p)});
for(let i=0;i<size;i++)for(let j=0;j<size;j++)if(!g[i][j])g[i][j]='abcdefghijklmnopqrstuvwxyz'[r(0,25)];
let valid=true;for(const [w,ps] of pos){for(let i=0;i<size;i++)for(let j=0;j<size;j++)for(const d of dirs){const e=[i+d[0]*(w.length-1),j+d[1]*(w.length-1)];if(e[0]<0||e[0]>=size||e[1]<0||e[1]>=size)continue;let m=true;for(let k=0;k<w.length;k++)if(g[i+d[0]*k][j+d[1]*k]!==w[k]){m=false;break}
if(m&&!ps.some(p=>p[0][0]==i&&p[0][1]==j&&p[p.length-1][0]==e[0]&&p[p.length-1][1]==e[1])){const p=[];for(let k=0;k<w.length;k++)p.push([i+d[0]*k,j+d[1]*k]);ps.push(p)}}
if(ps.length>3){valid=false;break}}
if(!valid)continue;return{n:size,grid:g.map(x=>x.join('')),paths:pos,dec:dp}}}return null}

const rv=[...new Set(R.filter(t=>t.st=='review'||t.st=='retry'||t.st=='model').map(t=>short(t.w,28)))],mw=miss.map(t=>short(t.w,28));const d=new Date(),score=String(G.sc[0]);
const c={id:Date.now(),date:d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),teacher:U?U.name:'',names:G.names,mode:G.mode,prog:G.prog,pats:G.pats,ch:DF[G.df],score,sc:G.sc.slice(),acc,first,retry,model,review:rev.length,hard:rv,missed:mw,fc:R.length-miss.length,tot:R.length,bonus:G.bonus,time:Math.floor(elapsed()/60000)+':'+String(Math.floor(elapsed()/1000)%60).padStart(2,'0'),rec:R.map(t=>({w:short(t.w,50),st:t.st,dis:t.dis,rd:t.rd,tm:t.tm,fd:t.found}))};
const au=G.auto&&S.order;if(U&&!au){const k='wf_rec_'+U.email,a=LS.get(k)||[];a.unshift(c);LS.set(k,a.slice(0,30))}try{LS.set('wf_session',null)}catch(e){}S.cur=c;G.done=true;render();au?turnDone(c):showReport()}
function showReport(){const c=S.cur,R=G.tg,full=c.fc==c.tot,rv=c.hard,mw=c.missed||[],sc=c.sc||G.sc;
const head=full?'Mission complete!':'Good effort! '+c.fc+' of '+c.tot+' words found.';
modal(`<div class="title" style="font-size:4vh">${full?'Mission complete':'Hunt finished'}</div><div class="ans" style="font-size:3.4vh">${head}</div><div class="q2" style="font-size:2.4vh;color:var(--mut)">Score: ${fmt(sc[0])}${c.bonus?' (includes +10 completion bonus)':''}</div>
<div class="st"><div><b>${c.fc}/${c.tot}</b><small>Words discovered</small></div><div><b>${c.acc}%</b><small>First-attempt reading accuracy</small></div><div><b>${c.first}</b><small>Read first try</small></div><div><b>${c.retry}</b><small>After a retry</small></div><div><b>${c.model}</b><small>After a model</small></div><div><b>${c.review}</b><small>For review or skipped</small></div></div>
<div class="nt"><b>Words to revisit:</b> ${rv.length?esc(rv.slice(0,8).join(', ')):'none this round'}${mw.length?`<br><b>Not found:</b> ${esc(mw.slice(0,10).join(', '))}`:''}<br><i>This report is for the teacher only.</i></div>
<div class="row"><button class="pri" style="font-size:2.4vh" onclick="sendRec(S.cur)">Send report to teacher email</button>${mw.length?`<button style="font-size:2.4vh" onclick="closeM()">View puzzle</button>`:''}${(rv.length||mw.length)&&G.kind=='grid'?`<button style="font-size:2.4vh" onclick="replay()">Replay difficult words</button>`:''}<button style="font-size:2.4vh" onclick="again()">New puzzle</button><button style="font-size:2.4vh" onclick="setup()">Back to setup</button></div>`)}
function again(){if(G.kind=='grid'){S.pool=pool();S.specs=S.pool.slice(0,Math.min(S.cnt,S.pool.length))}begin(G.kind=='grid'?S.specs:undefined)}
function replay(){const sp=G.tg.filter(t=>!t.found||t.st=='review'||t.st=='retry'||t.st=='model').map(t=>({w:(t.seg||t.w).split(' + ').join('+'),pi:t.pi}));begin(sp.length>=2?sp:undefined)}
const ROW=ST;
function recText(c){if(c.mode=='class')return classText(c);let t=`RF WORD FINDER - RUNNING RECORD\nDate: ${c.date}\nTeacher: ${c.teacher||'-'}\nStudent/Team: ${c.names.join(' vs ')}\nProgression: ${c.prog} (${c.pats.join(', ')})\nDifficulty: ${c.ch}\n\n`;
c.rec.forEach((x,i)=>{t+=`${i+1}. ${x.w} - ${x.fd===false?'Not found':(ST[x.st]||'Not read')}${x.dis?' (discovery +'+x.dis+', reading +'+x.rd+')':''}\n`});
return t+`\nScore: ${c.score}${c.bonus?' (includes completion bonus)':''}\nFirst-attempt accuracy: ${c.acc}%\nRead first try: ${c.first}\nAfter a retry: ${c.retry}\nAfter a model: ${c.model}\nNeeds review or skipped: ${c.review}\nWords to revisit: ${c.hard.join(', ')||'none'}\nNot found: ${(c.missed||[]).join(', ')||'none'}\nTime: ${c.time}\n`}
function recCSV(c){if(c.mode=='class')return classCSV(c);const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return ['Date,Student/Team,Progression,Item,Result,Discovery points,Reading points'].concat(c.rec.map(x=>[c.date,c.names[0],c.prog,x.w,x.fd===false?'Not found':(ST[x.st]||'Not read'),x.dis,x.rd].map(q).join(','))).join('\n')}
function sendRec(c){S.cur=c;modal(`<div class="ans" style="font-size:3.4vh">Running record</div><textarea id="rt" readonly>${esc(recText(c))}</textarea><input id="em" type="email" placeholder="Teacher email address" value="${esc(U?U.email:'')}">
<div class="row"><button class="pri" onclick="mail()">Open email draft</button><button onclick="copyRec()">Copy text</button><button id="dl" style="display:none" onclick="saveRec()">Save as CSV</button><button onclick="closeM()">Close</button></div><div class="fine" id="mm">Your email app opens with the record filled in. Press send there. If nothing opens, use Copy text.</div>`);
try{(window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(d=>{S.dl=d;if(d&&$('#dl'))$('#dl').style.display=''}).catch(()=>{})}catch(e){}}
function msg(t){const m=$('#mm');if(m)m.textContent=t}
function mail(){const em=($('#em').value||'').trim(),c=S.cur;if(!/^\S+@\S+\.\S+$/.test(em))return msg('Please enter a valid email address.');
let b=recText(c);const sj=encodeURIComponent('Running record: '+c.names.join(' vs ')+' - '+c.date);
while(encodeURIComponent(b).length>1700)b=b.slice(0,-60);const a=document.createElement('a');a.href='mailto:'+em+'?subject='+sj+'&body='+encodeURIComponent(b);a.target='_top';document.body.appendChild(a);a.click();a.remove();
msg('If your email app did not open, press Copy text and paste the record into an email.')}
function copyRec(){const t=recText(S.cur);const fb=()=>{const x=$('#rt');x.removeAttribute('readonly');x.select();try{document.execCommand('copy');msg('Copied. Paste it into an email.')}catch(e){msg('Select the text above and copy it.')}x.setAttribute('readonly','')};
try{navigator.clipboard.writeText(t).then(()=>msg('Copied. Paste it into an email.')).catch(fb)}catch(e){fb()}}
function saveRec(){if(!S.dl)return;S.dl.save({filename:'running-record-'+new Date().toISOString().slice(0,10)+'.csv',data:recCSV(S.cur)}).then(()=>msg('Saved.')).catch(e=>msg(e&&e.code=='declined'?'Save cancelled.':'Saving is not available here. Use Copy text.'))}
function history_(){const a=LS.get('wf_rec_'+U.email)||[];modal(`<div class="ans" style="font-size:3.4vh">Saved running records</div><div class="hist">${a.length?a.map((c,i)=>`<div><span><b>${esc(c.names.join(' vs '))}</b> | ${esc(c.prog)} | ${c.acc}% | ${esc(c.date)}</span><button onclick="sendRec(LS.get('wf_rec_'+U.email)[${i}])">Open</button></div>`).join(''):'<div>No records yet. Finish a match to save one.</div>'}</div><button onclick="closeM()">Close</button>`)}

function newGame(){fx('click');modal(`<div class="ans">Start a new game?</div><div class="q2" style="color:var(--mut)">The current hunt will be lost.</div><div class="row"><button class="pri big" style="font-size:2.8vh" onclick="try{LS.set('wf_session',null)}catch(e){};setup()">Yes, new game</button><button style="font-size:2.8vh" onclick="closeM()">Cancel</button></div>`)}
function cf(n){const C=['#4f63d8','#f0b45a','#a9b6f5','#334155','#f7d79b'];for(let i=0;i<n;i++){const d=document.createElement('span');d.className='cf';d.style.cssText=`left:${r(0,98)}vw;background:${pick(C)};animation-delay:${Math.random()*1.6}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}}
// ---------- class mode (auto) ----------
function pickSpecs(lv){const pg=PG[S.prog],n=S.ac;let all=[];[...S.pats].forEach(pi=>{const P=pg.p[pi],W=wordsOf(P),E=P[4]?P[4][0]:Math.ceil(W.length*.4);W.forEach((w,i)=>all.push({w,pi,t:i<E?0:1,d:w.replace(/\+/g,'')}))});
if(all.filter(x=>!S.used.has(x.d)).length<n)S.used.clear();const av=all.filter(x=>!S.used.has(x.d)),e=shuf(av.filter(x=>!x.t)),h=shuf(av.filter(x=>x.t));let o;
if(lv=='mix')o=shuf(av).slice(0,n);else{o=e.slice(0,lv=='easy'?n:n>=5?2:1);if(lv=='adv')o=o.concat(h.slice(0,n-o.length));if(o.length<n)o=o.concat(shuf(av.filter(x=>!o.includes(x))).slice(0,n-o.length))}
o.forEach(x=>S.used.add(x.d));return o.map(x=>({w:x.w,pi:x.pi}))}
function beginAuto(){closeM();const T=ros().map(t=>({name:t.name,pl:shuf(t.pl)})),ord=[],tq=shuf(T.map((_,i)=>i)),qs=T.map(t=>[...t.pl]);
while(qs.some(q=>q.length))tq.forEach(i=>{if(qs[i].length)ord.push({t:i,n:qs[i].pop()})});
S.T=T;S.order=ord;S.ti=0;S.res=[];S.ts=T.map(()=>0);S.rec=[];S.used=new Set();S.t0=Date.now();AU();callStu()}
function callStu(){const o=S.order[S.ti],t=S.T[o.t],nm=t.pl;
app.innerHTML=`<div class="hdr"><div class="brand">Word <span>Finder</span></div><div class="row"><button class="ghost" onclick="skipStu()">Absent, skip</button><button class="ghost" onclick="newGame()">New game</button></div></div>
<div class="auth"><div class="tag">Round ${S.ti+1} of ${S.order.length}</div><div class="logo" style="font-size:9vh">${esc(t.name)}</div><div class="tag">${PG[S.prog].k=='w'?lvTxt(lvFor(t.name)):'same text for every student'}</div><div class="logo" id="cn" style="font-size:11vh">${esc(nm.length>1?pick(nm):o.n)}</div><button class="pri big" id="rb" disabled onclick="startTurn()">I am ready</button></div>`;
if(nm.length>1){let k=0;const iv=setInterval(()=>{const e=$('#cn');if(!e)return clearInterval(iv);if(++k<14){e.textContent=pick(nm);return}clearInterval(iv);e.textContent=o.n;$('#rb').disabled=false;fx('click')},90)}else $('#rb').disabled=false}
function skipStu(){S.ti++;S.ti>=S.order.length?classReport():callStu()}
function startTurn(){const o=S.order[S.ti];S.names=[o.n];if(PG[S.prog].k=='w')begin(pickSpecs(lvFor(S.T[o.t].name)));else begin()}
function turnDone(c){const o=S.order[S.ti],tn=S.T[o.t].name,sc=G.sc[0];S.ts[o.t]+=sc;S.res.push({n:o.n,tm:tn,sc,fc:c.fc,tot:c.tot,acc:c.acc,first:c.first,att:G.tg.filter(t=>t.st&&t.st!='skip').length,hard:c.hard,missed:c.missed||[]});c.rec.forEach(x=>S.rec.push({...x,stu:o.n,tn}));
const last=S.ti+1>=S.order.length;setTimeout(()=>modal(`<div class="ans" style="font-size:3.6vh">${esc(o.n)} scored ${fmt(sc)} points</div><div class="q2" style="color:var(--mut)">${esc(tn)} team total: ${fmt(S.ts[o.t])}</div><div class="st"><div><b>${c.fc}/${c.tot}</b><small>Words discovered</small></div><div><b>${c.acc}%</b><small>Read first try</small></div><div><b>${c.review}</b><small>For review</small></div></div><button class="pri big" style="font-size:2.8vh" onclick="nextStu()">${last?'Class results':'Next student'}</button>`),400)}
function nextStu(){closeM();S.ti++;S.ti>=S.order.length?classReport():callStu()}
function classReport(){const T=S.T.map((t,i)=>({name:t.name,sc:S.ts[i],n:S.res.filter(x=>x.tm==t.name).length})).sort((a,b)=>b.sc-a.sc),top=T[0]?T[0].sc:0,win=T.filter(x=>x.sc==top),fs=S.res.reduce((a,x)=>a+x.first,0),at=S.res.reduce((a,x)=>a+x.att,0),acc=at?Math.round(fs/at*100):0,d=new Date(),pg=PG[S.prog];
const c={id:Date.now(),date:d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),teacher:U?U.name:'',names:['Class '+CN],mode:'class',cls:CN,prog:pg.n,pats:[...S.pats].map(i=>pg.p[i][0]),ch:DF[S.df],teams:T,res:S.res,rec:S.rec,acc,score:String(T.reduce((a,x)=>a+x.sc,0))};
if(U){const k='wf_rec_'+U.email,a=LS.get(k)||[];a.unshift(c);LS.set(k,a.slice(0,30))}
S.cur=c;fx('goal');cf(60);modal(`<div class="title" style="font-size:4vh">Class complete</div><div class="ans" style="font-size:3.4vh">${win.length>1?'It is a tie!':esc(win[0].name)+' win'+(/s$/i.test(win[0].name)?'':'s')+'!'}</div>
<div class="st">${T.map(x=>`<div><b>${fmt(x.sc)}</b><small>${esc(x.name)} (${x.n} students, avg ${x.n?fmt(Math.round(x.sc/x.n*10)/10):0})</small></div>`).join('')}</div>
<div class="hist">${S.res.map(x=>`<div><span><b>${esc(x.n)}</b> (${esc(x.tm)})</span><span>${fmt(x.sc)} pts | ${x.fc}/${x.tot} found | ${x.acc}%${x.hard.length?' | revisit: '+esc(x.hard.slice(0,3).join(', ')):''}</span></div>`).join('')}</div>
<div class="row"><button class="pri" style="font-size:2.4vh" onclick="sendRec(S.cur)">Send report to teacher email</button><button style="font-size:2.4vh" onclick="beginAuto()">Play again</button><button style="font-size:2.4vh" onclick="setup()">Back to setup</button></div>`)}
const classText=c=>{let t=`RF WORD FINDER - CLASS RUNNING RECORD\nDate: ${c.date}\nTeacher: ${c.teacher||'-'}\nClass: ${c.cls}\nProgression: ${c.prog} (${c.pats.join(', ')})\nFirst-attempt reading accuracy: ${c.acc}%\n\nTEAM STANDINGS\n`;c.teams.forEach(x=>{t+=`${x.name}: ${fmt(x.sc)} points (${x.n} students)\n`});t+='\nSTUDENTS\n';c.res.forEach(x=>{t+=`${x.n} (${x.tm}): ${fmt(x.sc)} pts, ${x.fc}/${x.tot} found, ${x.acc}% first try${x.hard.length?'. Revisit: '+x.hard.join(', '):''}${x.missed.length?'. Not found: '+x.missed.join(', '):''}\n`});return t};
const classCSV=c=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return ['Date,Class,Team,Student,Progression,Item,Result,Discovery points,Reading points'].concat(c.rec.map(x=>[c.date,c.cls,x.tn,x.stu,c.prog,x.w,x.fd===false?'Not found':(ST[x.st]||'Not read'),x.dis,x.rd].map(q).join(','))).join('\n')};
function tick(){if(!G||G.done||!G.tm||G.paused||G.cur!=null){if(G)G.tk=null;return}const n=Date.now();if(G.tk)G.tl-=n-G.tk;G.tk=n;const e=$('#tmv');if(e){const q=Math.max(0,Math.ceil(G.tl/1000));e.textContent=Math.floor(q/60)+':'+String(q%60).padStart(2,'0');e.style.color=q<=10?'#b4442c':''}if(G.tl<=0)timeUp()}
function timeUp(){if(G.done)return;G.tl=0;fx('whistle');toast('Time is up!','Finishing the hunt');endHunt()}
setInterval(tick,250);
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='mod';o.innerHTML=`<div class="box">${h}</div>`;document.body.appendChild(o)}
function closeM(){const o=$('#mod');if(o)o.remove()}

S.am=LS.get('wf_mode')=='auto'?'auto':'manual';S.tm=[0,30,60,90,120].includes(LS.get('wf_tm'))?LS.get('wf_tm'):0;if(S.am=='auto'&&CODE)loadCode(CODE);
{const A=LS.get('ws_accts')||{},s=LS.get('ws_session');if(s&&A[s]){U={email:s,name:A[s].name};setup()}else auth()}
</script></body></html>
